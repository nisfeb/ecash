# hoon-test-kit: what the Hoon suites build, and where it goes on the test
# desk. Sourced by bash and parsed by python, so plain KEY="value" lines only.
# Paths are relative to this file. See scripts/hoon-test-kit/README.md.

DESK=ecash-test

# the libs the suites cover, in import order: curve imports nothing,
# bdhke imports curve, ecash-http nothing, ecash-rules all three and
# sur/ecash; the services agent's rules import bdhke, ecash-http and
# sur/ecash-services. Each lands at lib/<name>.hoon
LIBS="desk/lib/curve.hoon desk/lib/bdhke.hoon desk/lib/ecash-http.hoon desk/lib/ecash-rules.hoon desk-services/lib/ecash-services-rules.hoon"

# every *.hoon here lands in tests/lib/
TESTS=tests/lib

# the two agents' types, which the rules libs import
FILES="desk/sur/ecash.hoon=sur/ecash.hoon desk-services/sur/ecash-services.hoon=sur/ecash-services.hoon"

# marks copied from %base at setup: json builds through mime
MARKS="json mime"
