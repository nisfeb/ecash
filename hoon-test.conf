# hoon-test-kit: what the Hoon suites build, and where it goes on the test
# desk. Sourced by bash and parsed by python, so plain KEY="value" lines only.
# Paths are relative to this file. See scripts/hoon-test-kit/README.md.

DESK=ecash-test

# the libs the suites cover, in import order: curve imports nothing,
# bdhke imports curve, ecash-http nothing, blind bdhke and ecash-http,
# ecash-rules those and sur/ecash, tessera-rules blind and sur/tessera.
# Each lands at lib/<name>.hoon
LIBS="desk/lib/curve.hoon desk/lib/bdhke.hoon desk/lib/ecash-http.hoon desk/lib/blind.hoon desk/lib/ecash-rules.hoon desk-tessera/lib/tessera-rules.hoon"

# every *.hoon here lands in tests/lib/
TESTS=tests/lib

# the agents' types, which the rules libs import
FILES="desk/sur/ecash.hoon=sur/ecash.hoon desk-tessera/sur/tessera.hoon=sur/tessera.hoon"

# marks copied from %base at setup: json builds through mime
MARKS="json mime"
